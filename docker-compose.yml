services:
  # ── Banco de Dados ──
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: robopod
      POSTGRES_USER: robopod
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-robopod_secret}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U robopod"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Redis (necessário para Evolution API v2) ──
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Evolution API (WhatsApp) ──
  evolution:
    image: evoapicloud/evolution-api:latest
    restart: unless-stopped
    ports:
      - "8083:8080"
    environment:
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY}
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://robopod:${POSTGRES_PASSWORD:-robopod_secret}@db:5432/robopod?schema=evolution
      DATABASE_CONNECTION_CLIENT_NAME: evolution_robopod
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "true"
      DATABASE_SAVE_MESSAGE_UPDATE: "true"
      DATABASE_SAVE_DATA_CONTACTS: "true"
      DATABASE_SAVE_DATA_CHATS: "true"
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://redis:6379
    volumes:
      - evolution_data:/evolution/instances
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── App Django (Bot) ──
  app:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      evolution:
        condition: service_started
    command: >
      sh -c "python manage.py migrate --noinput &&
             uvicorn robopod.asgi:application --host 0.0.0.0 --port 8000 --reload"

volumes:
  pgdata:
  redis_data:
  evolution_data:
