# Produção: nenhuma porta fica aberta para a internet. Painel e manager da
# Evolution escutam só em 127.0.0.1 da VPS e chegam à equipe pelo Tailscale
# (tailscale serve, veja o GUIA_DEPLOY_VPS.md). O banco não tem porta nenhuma.
# No PC de desenvolvimento: docker compose -f docker-compose.yml -f docker-compose.dev.yml up
services:
  # ── Banco de Dados ──
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: robopod
      POSTGRES_USER: robopod
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U robopod"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Redis (necessário para Evolution API v2) ──
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Evolution API (WhatsApp) ──
  evolution:
    # Fixe a versão no .env (EVOLUTION_VERSION=v2.x.y) para uma atualização da
    # imagem não entrar sozinha num restart
    image: evoapicloud/evolution-api:${EVOLUTION_VERSION:-latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:8083:8080"
    environment:
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:?defina EVOLUTION_API_KEY no .env}
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://robopod:${POSTGRES_PASSWORD}@db:5432/robopod?schema=evolution
      DATABASE_CONNECTION_CLIENT_NAME: evolution_robopod
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "true"
      DATABASE_SAVE_MESSAGE_UPDATE: "true"
      DATABASE_SAVE_DATA_CONTACTS: "true"
      DATABASE_SAVE_DATA_CHATS: "true"
      # Webhook único para todos os números (lojas): cada mensagem chega ao app
      # com o nome da instância. Não precisa configurar webhook por instância.
      WEBHOOK_GLOBAL_ENABLED: "true"
      WEBHOOK_GLOBAL_URL: http://app:8000/webhook/evolution/?token=${WEBHOOK_TOKEN:?defina WEBHOOK_TOKEN no .env}
      WEBHOOK_GLOBAL_WEBHOOK_BY_EVENTS: "false"
      WEBHOOK_EVENTS_MESSAGES_UPSERT: "true"
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://redis:6379
    volumes:
      - evolution_data:/evolution/instances
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── App Django (Bot) ──
  app:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      # Só a pasta de arquivos (cardápio em PDF, comprovantes) fica fora do
      # container; o código vai dentro da imagem (docker compose up --build)
      - ./media:/app/media
    depends_on:
      db:
        condition: service_healthy
      evolution:
        condition: service_started
    command: >
      sh -c "python manage.py migrate --noinput &&
             uvicorn robopod.asgi:application --host 0.0.0.0 --port 8000"

  # ── Limpeza diária dos dados dos clientes (endereço, comprovante, conversas) ──
  limpeza:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./media:/app/media
    depends_on:
      app:
        condition: service_started
    command: >
      sh -c "sleep 120; while true; do python manage.py limpar_dados; sleep 86400; done"

volumes:
  pgdata:
  redis_data:
  evolution_data:
