{% url 'painel:estoque_ajustar' tipo obj.pk as url_ajuste %}
<div class="controle-estoque">
  {% if obj.estoque is not None %}
  <button class="btn peq" type="button" aria-label="Diminuir" hx-post="{{ url_ajuste }}" hx-vals='{"delta": "-1"}' hx-target="#produto-{{ p.pk }}" hx-swap="outerHTML">−</button>
  {% endif %}
  <input class="in-estoque{% if obj.estoque is not None and obj.estoque <= 0 %} zerado{% elif obj.estoque is not None and obj.estoque <= minimo %} baixo{% endif %}"
         type="number" min="0" name="estoque" value="{{ obj.estoque|default_if_none:'' }}" placeholder="—"
         title="Vazio = não controla estoque" aria-label="Estoque"
         hx-post="{{ url_ajuste }}" hx-trigger="change" hx-target="#produto-{{ p.pk }}" hx-swap="outerHTML">
  {% if obj.estoque is not None %}
  <button class="btn peq" type="button" aria-label="Aumentar" hx-post="{{ url_ajuste }}" hx-vals='{"delta": "1"}' hx-target="#produto-{{ p.pk }}" hx-swap="outerHTML">+</button>
  {% if obj.estoque <= 0 %}<span class="tag cancelado">esgotado</span>{% elif obj.estoque <= minimo %}<span class="tag aguardando_pagamento">baixo</span>{% endif %}
  {% else %}
  <span class="muted peq">não controla</span>
  {% endif %}
</div>
