<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
{% include "painel/parciais/pwa_head.html" %}
<title>Entrar · Robopod</title>
<style>
:root { color-scheme: light; --bg: #f4f4f2; --surface: #fcfcfb; --border: #e2e1dc; --text: #0b0b0b; --text-2: #52514e; --accent: #2a78d6; --bad: #b42323; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { color-scheme: dark; --bg: #121211; --surface: #1a1a19; --border: #33332f; --text: #fff; --text-2: #c3c2b7; --accent: #3987e5; --bad: #f07a7a; } }
:root[data-theme="dark"] { color-scheme: dark; --bg: #121211; --surface: #1a1a19; --border: #33332f; --text: #fff; --text-2: #c3c2b7; --accent: #3987e5; --bad: #f07a7a; }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding: 16px; }
form { width: 100%; max-width: 340px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 24px; display: grid; gap: 14px; }
h1 { margin: 0; font-size: 20px; } p { margin: 0; color: var(--text-2); }
label { display: grid; gap: 4px; font-size: 13px; color: var(--text-2); }
input { font: inherit; color: var(--text); background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 9px 10px; }
input:focus, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
button { font: inherit; font-weight: 600; border: 0; border-radius: 8px; padding: 10px; background: var(--accent); color: #fff; cursor: pointer; }
.erro { color: var(--bad); font-size: 13px; }
</style>
</head>
<body>
<form method="post">
  {% csrf_token %}
  <div><h1>Robopod</h1><p>Painel da loja</p></div>
  {% if form.errors %}<div class="erro">{% if form.bloqueado %}{{ form.non_field_errors.0 }}{% else %}Usuário ou senha incorretos.{% endif %}</div>{% endif %}
  <label>Usuário <input type="text" name="username" autofocus autocomplete="username" required></label>
  <label>Senha <input type="password" name="password" autocomplete="current-password" required></label>
  <input type="hidden" name="next" value="{{ next }}">
  <button type="submit">Entrar</button>
</form>
</body>
</html>
